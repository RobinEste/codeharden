name: Upstream sync merge

# CodeHarden's delayed merge of upstream changes. The rules:
#
# Branches
#   main    a pure mirror of upstream main (leonvanzyl/codeden). Nobody commits to it; this
#           workflow only ever fast-forwards it.
#   harden  CodeHarden: upstream plus this fork's own changes. Upstream arrives by merge
#           commits, never by rebase or force-push.
#
# Job "mirror": fast-forwards this repository's main to upstream main. If main has commits
# upstream doesn't have, the job fails and changes nothing.
#
# Job "merge": looks at every open pull request into harden whose head branch starts with
# `sync/`, and merges it with a merge commit only if ALL of these hold:
#   1. The head branch lives in this repository (not in someone else's fork).
#   2. It has the label `sync-approved`, and neither `sync-needs-review` nor `sync-hold`.
#   3. `sync-approved` was last applied at least 48 hours ago. The time comes from the pull
#      request's timeline (its `labeled` events), not from when the pull request was opened.
#   4. The head branch has not been pushed to since that label was applied: the approval
#      covers the commit that was reviewed, not a later one. Re-apply the label to restart
#      the 48 hours.
#   5. The head commit is on upstream main, or it is a two-parent merge whose first parent is
#      on upstream main and whose second parent is on harden. So a sync pull request can only
#      bring upstream code plus the reviewer's conflict-resolution merge; a label alone can't
#      get an arbitrary branch merged.
#   6. Every check on the head commit has finished and passed (at least one check must
#      exist), and GitHub reports the pull request as mergeable.
# Anything else is skipped, and the log says why.
#
# Job "release": runs only when this run merged at least one sync pull request (or when a
# manual run asks for it, after a sync pull request was merged by hand). It makes one
# CodeHarden release on harden, in a single commit `release: <version> (upstream <sha>)`:
#   - VERSION: `YYYY.MMDD.HHMM`, the release time in America/New_York.
#   - CODEHARDEN-CHANGELOG.md: a new entry on top, with the upstream commit subjects merged
#     since the last release and this fork's own commits since then (no merge commits).
#   - state/upstream-base: the upstream commit harden now contains, where the next release's
#     upstream section starts.
# The commit is tagged `v<version>`. If that tag already exists the job fails; it never
# overwrites a tag. A run that merges nothing makes no release. The app's own version number
# (apps/cli, apps/desktop, SOURCE_VERSION) stays upstream's and is never touched.
#
# Security of this workflow
#   - Permissions are the minimum: contents: write (push main, merge, push the release
#     commit and tag), pull-requests: write (merge), checks: read (read the check results).
#     Nothing else.
#   - It uses no actions at all, only `git`, `gh` and `jq` from the runner image, so there is
#     nothing to pin. If an action is ever added here, pin it by full commit SHA.
#   - It never checks out or runs code from a pull request. Commits are fetched into a bare
#     repository as data, only to compare ancestry. The release job checks out three files
#     of harden (VERSION, the changelog, state/upstream-base) and nothing else, and runs
#     nothing from the repository.
#   - It authenticates with the run's own GITHUB_TOKEN. No personal tokens, no secrets.
#   - Values from pull requests (branch names, labels) reach the scripts as data through `jq`
#     and environment variables, never through `${{ }}` in a script.
#
# Known limit: GITHUB_TOKEN may not create or change files in .github/workflows. When
# upstream changes a workflow file, the mirror push and the merge of that sync pull request
# are refused; the log says so, and the repository owner does that one by hand.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Make a release even if this run merges nothing (after a sync pull request was merged by hand)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream-sync-merge
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/leonvanzyl/codeden
  MIRROR_BRANCH: main
  TARGET_BRANCH: harden
  HEAD_PREFIX: sync/
  APPROVED_LABEL: sync-approved
  BLOCKING_LABELS: sync-needs-review sync-hold
  DELAY_HOURS: "48"
  UPSTREAM_NAME: leonvanzyl/codeden
  CHANGELOG_FILE: CODEHARDEN-CHANGELOG.md
  CHANGELOG_TITLE: "# CodeHarden releases"
  BASE_FILE: state/upstream-base
  RELEASE_TZ: America/New_York

jobs:
  mirror:
    name: Mirror upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fast-forward main to upstream main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fork_url="https://github.com/${GITHUB_REPOSITORY}"
          git init --quiet --bare "$RUNNER_TEMP/mirror.git"
          cd "$RUNNER_TEMP/mirror.git"
          git fetch --quiet --no-tags "$UPSTREAM_URL" "refs/heads/${MIRROR_BRANCH}:refs/sync/upstream"
          git fetch --quiet --no-tags "$fork_url" "refs/heads/${MIRROR_BRANCH}:refs/sync/mirror"
          upstream=$(git rev-parse refs/sync/upstream)
          mirror=$(git rev-parse refs/sync/mirror)
          echo "upstream ${MIRROR_BRANCH}: $upstream"
          echo "this repository's ${MIRROR_BRANCH}: $mirror"
          if [ "$upstream" = "$mirror" ]; then
            echo "::notice::${MIRROR_BRANCH} is already at upstream ($upstream)."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$mirror" "$upstream"; then
            echo "::error::${MIRROR_BRANCH} can't be fast-forwarded: it has commits that upstream ${MIRROR_BRANCH} doesn't have ($mirror is not an ancestor of $upstream). ${MIRROR_BRANCH} must stay a pure mirror; nothing was changed. Move those commits to another branch and reset ${MIRROR_BRANCH} by hand."
            exit 1
          fi
          # A plain push, never forced: git itself refuses anything that isn't a fast-forward.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if ! git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push "$fork_url" "refs/sync/upstream:refs/heads/${MIRROR_BRANCH}" 2> "$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log"
            if grep -qi "workflow" "$RUNNER_TEMP/push.log"; then
              echo "::error::The push was refused because upstream changed a file in .github/workflows, which GITHUB_TOKEN may not do. Fast-forward ${MIRROR_BRANCH} by hand: git fetch $UPSTREAM_URL ${MIRROR_BRANCH} && git push $fork_url FETCH_HEAD:refs/heads/${MIRROR_BRANCH}"
            else
              echo "::error::Pushing ${MIRROR_BRANCH} failed. If the message above is a permission error, check Settings > Actions > General > Workflow permissions (the workflow asks for contents: write itself) and any branch protection or ruleset on ${MIRROR_BRANCH}."
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/push.log"
          echo "::notice::Fast-forwarded ${MIRROR_BRANCH} from $mirror to $upstream."

  merge:
    name: Merge approved sync pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Merge sync pull requests approved at least 48 hours ago
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          fork_url="https://github.com/${repo}"
          failed=0
          merged=0

          skip() { echo "  SKIP #$number: $1"; }

          gh api --paginate "repos/${repo}/pulls?state=open&base=${TARGET_BRANCH}&per_page=100" \
            --jq '.[] | @base64' > "$RUNNER_TEMP/pulls.txt"
          prs=()
          while IFS= read -r row; do
            ref=$(printf '%s' "$row" | base64 -d | jq -r '.head.ref')
            case "$ref" in "${HEAD_PREFIX}"*) prs+=("$row") ;; esac
          done < "$RUNNER_TEMP/pulls.txt"

          echo "Open pull requests into ${TARGET_BRANCH}: $(wc -l < "$RUNNER_TEMP/pulls.txt" | tr -d ' '); with a ${HEAD_PREFIX} head branch: ${#prs[@]}"
          if [ "${#prs[@]}" -eq 0 ]; then
            echo "::notice::No open sync pull requests into ${TARGET_BRANCH}. Nothing to merge."
            echo "merged=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commits as data, for ancestry only. Nothing is checked out and nothing is run.
          git init --quiet --bare "$RUNNER_TEMP/sync.git"
          cd "$RUNNER_TEMP/sync.git"
          git fetch --quiet --no-tags "$UPSTREAM_URL" "refs/heads/${MIRROR_BRANCH}:refs/sync/upstream"
          git fetch --quiet --no-tags "$fork_url" "refs/heads/${TARGET_BRANCH}:refs/sync/target"
          now=$(date -u +%s)

          for row in "${prs[@]}"; do
            pr=$(printf '%s' "$row" | base64 -d)
            number=$(jq -r '.number' <<< "$pr")
            head_ref=$(jq -r '.head.ref' <<< "$pr")
            head_sha=$(jq -r '.head.sha' <<< "$pr")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pr")
            labels=$(jq -r '[.labels[].name] | join(" ")' <<< "$pr")
            echo "#$number  ${head_ref} @ ${head_sha}  labels: ${labels:-none}"
            if ! [[ "$number" =~ ^[0-9]+$ && "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              skip "unexpected pull request data."; continue
            fi

            # 1. Same repository.
            if [ "$head_repo" != "$repo" ]; then
              skip "its head branch is in ${head_repo:-a deleted repository}, not in ${repo}."; continue
            fi

            # 2. Labels.
            if ! jq -e --arg l "$APPROVED_LABEL" 'any(.labels[]; .name == $l)' <<< "$pr" > /dev/null; then
              skip "it doesn't have the label ${APPROVED_LABEL}."; continue
            fi
            blocked=""
            for l in $BLOCKING_LABELS; do
              if jq -e --arg l "$l" 'any(.labels[]; .name == $l)' <<< "$pr" > /dev/null; then blocked="$l"; fi
            done
            if [ -n "$blocked" ]; then
              skip "it has the label ${blocked}."; continue
            fi

            # 3. The label's age, from the timeline.
            if ! labeled_at=$(gh api --paginate "repos/${repo}/issues/${number}/timeline?per_page=100" \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"${APPROVED_LABEL}\") | .created_at" | sort | tail -n 1); then
              skip "its timeline couldn't be read."; failed=1; continue
            fi
            if [ -z "$labeled_at" ]; then
              skip "its timeline has no 'labeled' event for ${APPROVED_LABEL}."; continue
            fi
            labeled_s=$(date -u -d "$labeled_at" +%s)
            age_h=$(( (now - labeled_s) / 3600 ))
            if [ $(( now - labeled_s )) -lt $(( DELAY_HOURS * 3600 )) ]; then
              skip "${APPROVED_LABEL} was applied ${age_h}h ago (${labeled_at}); it merges after ${DELAY_HOURS}h."; continue
            fi

            # 4. No push to the head branch since the approval.
            ref_q=$(jq -rn --arg r "refs/heads/${head_ref}" '$r | @uri')
            if ! activity=$(gh api "repos/${repo}/activity?ref=${ref_q}&per_page=1" --jq '.[0] // {} | "\(.after // "") \(.timestamp // "")"'); then
              skip "the head branch's push history couldn't be read."; failed=1; continue
            fi
            pushed_sha=${activity%% *}
            pushed_at=${activity#* }
            if [ "$pushed_sha" != "$head_sha" ] || [ -z "$pushed_at" ]; then
              skip "the head branch's latest push (${pushed_sha:-unknown}) isn't the pull request's head; it will be looked at again on the next run."; continue
            fi
            if [ "$(date -u -d "$pushed_at" +%s)" -gt "$labeled_s" ]; then
              skip "the head branch was pushed at ${pushed_at}, after ${APPROVED_LABEL} was applied (${labeled_at}). Review it again and re-apply the label."; continue
            fi

            # 5. Upstream code only (plus a merge with the target branch).
            if ! git fetch --quiet --no-tags "$fork_url" "$head_sha" 2> /dev/null; then
              skip "its head commit couldn't be fetched."; failed=1; continue
            fi
            if git merge-base --is-ancestor "$head_sha" refs/sync/upstream; then
              echo "  head is a commit on upstream ${MIRROR_BRANCH}"
            else
              read -r -a parents <<< "$(git rev-list --parents -n 1 "$head_sha" | cut -d' ' -f2-)"
              if [ "${#parents[@]}" -ne 2 ]; then
                skip "its head is not on upstream ${MIRROR_BRANCH} and is not a two-parent merge."; continue
              fi
              if ! git merge-base --is-ancestor "${parents[0]}" refs/sync/upstream; then
                skip "its head is a merge whose first parent (${parents[0]}) is not on upstream ${MIRROR_BRANCH}."; continue
              fi
              if ! git merge-base --is-ancestor "${parents[1]}" refs/sync/target; then
                skip "its head is a merge whose second parent (${parents[1]}) is not on ${TARGET_BRANCH}."; continue
              fi
              echo "  head is a merge of upstream ${parents[0]} with ${TARGET_BRANCH} ${parents[1]}"
            fi

            # 6. Checks and mergeability.
            if ! checks=$(gh api --paginate "repos/${repo}/commits/${head_sha}/check-runs?filter=latest&per_page=100" \
              --jq '.check_runs[] | "\(.status) \(.conclusion // "none") \(.name)"'); then
              skip "its checks couldn't be read."; failed=1; continue
            fi
            if [ -z "$checks" ]; then
              skip "its head commit has no checks yet."; continue
            fi
            bad=$(grep -vE '^completed (success|skipped|neutral) ' <<< "$checks" || true)
            if [ -n "$bad" ]; then
              skip "not every check has passed: $(tr '\n' ';' <<< "$bad")"; continue
            fi
            mergeable="null"; state=""
            for attempt in 1 2 3 4; do
              detail=$(gh api "repos/${repo}/pulls/${number}")
              mergeable=$(jq -r '.mergeable' <<< "$detail")
              state=$(jq -r '.mergeable_state' <<< "$detail")
              current_sha=$(jq -r '.head.sha' <<< "$detail")
              [ "$mergeable" != "null" ] && break
              sleep 5
            done
            if [ "$current_sha" != "$head_sha" ]; then
              skip "its head changed during this run."; continue
            fi
            if [ "$mergeable" != "true" ] || { [ "$state" != "clean" ] && [ "$state" != "has_hooks" ]; }; then
              skip "GitHub doesn't report it as mergeable (mergeable: ${mergeable}, state: ${state})."; continue
            fi

            echo "  MERGE #$number: approved ${age_h}h ago, checks passed, mergeable."
            if gh pr merge "$number" --repo "$repo" --merge --match-head-commit "$head_sha" 2> "$RUNNER_TEMP/merge.log"; then
              merged=$((merged + 1))
              echo "::notice::Merged sync pull request #$number (${head_ref} @ ${head_sha}) into ${TARGET_BRANCH}."
            else
              cat "$RUNNER_TEMP/merge.log"
              failed=1
              if grep -qi "workflow" "$RUNNER_TEMP/merge.log"; then
                echo "::error::#$number passed every rule but changes a file in .github/workflows, which GITHUB_TOKEN may not merge. Merge it by hand with a merge commit."
              else
                echo "::error::#$number passed every rule but the merge failed. If the message above is a permission error, check that merge commits are allowed (Settings > General > Pull Requests) and any branch protection or ruleset on ${TARGET_BRANCH}."
              fi
            fi
          done

          echo "Merged: $merged"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          exit "$failed"

  release:
    name: Release CodeHarden
    needs: merge
    # Also after a merge job that failed on one pull request but merged another.
    if: ${{ always() && (needs.merge.outputs.merged > 0 || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Write VERSION and the changelog, commit, tag and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fork_url="https://github.com/${GITHUB_REPOSITORY}"
          git init --quiet "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          git remote add origin "$fork_url"
          git fetch --quiet --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git fetch --quiet --no-tags "$UPSTREAM_URL" "refs/heads/${MIRROR_BRANCH}:refs/sync/upstream"
          # Only the three release files reach the working tree; nothing from it is run.
          git sparse-checkout set --no-cone "/VERSION" "/${CHANGELOG_FILE}" "/${BASE_FILE}"
          git checkout --quiet -B "$TARGET_BRANCH" "refs/remotes/origin/${TARGET_BRANCH}"

          for f in VERSION "$CHANGELOG_FILE" "$BASE_FILE"; do
            if [ ! -f "$f" ]; then echo "::error::${TARGET_BRANCH} has no $f; can't make a release."; exit 1; fi
          done
          if [ "$(head -n 1 "$CHANGELOG_FILE")" != "$CHANGELOG_TITLE" ]; then
            echo "::error::${CHANGELOG_FILE} doesn't start with '${CHANGELOG_TITLE}'."; exit 1
          fi
          prev_base=$(tr -d '[:space:]' < "$BASE_FILE")
          if ! [[ "$prev_base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${prev_base}^{commit}" 2> /dev/null; then
            echo "::error::${BASE_FILE} doesn't hold a commit of this repository."; exit 1
          fi
          # The newest upstream commit that the target branch contains.
          new_base=$(git merge-base HEAD refs/sync/upstream)
          if ! git merge-base --is-ancestor "$prev_base" "$new_base"; then
            echo "::error::The last release's upstream base ($prev_base) is not an ancestor of the upstream commit ${TARGET_BRANCH} now contains ($new_base)."; exit 1
          fi
          prev_release=$(git log -1 --format=%H -- VERSION)

          # One clock reading for the version and the changelog heading.
          read -r version day time <<< "$(TZ="$RELEASE_TZ" date '+%Y.%m%d.%H%M %Y-%m-%d %H:%M')"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::Tag ${tag} already exists. Nothing was changed; run the workflow again in a minute."; exit 1
          fi

          upstream_lines=$(git log --no-merges --pretty='- %s' "${prev_base}..${new_base}")
          own_lines=$(git log --no-merges --pretty='- %s' "${prev_release}..HEAD" --not "$new_base")
          {
            printf '%s\n\n## %s — %s %s\n\n' "$CHANGELOG_TITLE" "$version" "$day" "$time"
            if [ -z "$upstream_lines" ] && [ -z "$own_lines" ]; then
              printf -- '- rebuild only (upstream base or dependency refresh)\n\n'
            fi
            if [ -n "$upstream_lines" ]; then printf '### upstream (%s)\n%s\n\n' "$UPSTREAM_NAME" "$upstream_lines"; fi
            if [ -n "$own_lines" ]; then printf '### codeharden\n%s\n\n' "$own_lines"; fi
            tail -n +3 "$CHANGELOG_FILE"
          } > "$RUNNER_TEMP/changelog.new"
          cp "$RUNNER_TEMP/changelog.new" "$CHANGELOG_FILE"
          printf '%s\n' "$version" > VERSION
          printf '%s\n' "$new_base" > "$BASE_FILE"

          short=$(git rev-parse --short=8 "$new_base")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION "$CHANGELOG_FILE" "$BASE_FILE"
          git commit --quiet -m "release: ${version} (upstream ${short})"
          git tag -a "$tag" -m "CodeHarden ${version} (upstream ${short})"
          # One atomic push, never forced: both the commit and the tag land, or neither.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin "HEAD:refs/heads/${TARGET_BRANCH}" "refs/tags/${tag}"
          echo "::notice::Released CodeHarden ${version} (${tag}) on ${TARGET_BRANCH}, upstream base ${short}."
